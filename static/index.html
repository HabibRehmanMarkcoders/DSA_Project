<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — Music Playlist Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Pulse</p>
        <p class="brand-tag">Playlist Manager</p>
      </div>
    </div>

    <div class="sidebar-block">
      <h2 class="sidebar-label">Your playlists</h2>
      <form id="new-form">
        <input id="new-name" placeholder="New playlist name" required autocomplete="off">
        <button type="submit" aria-label="Create playlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <ul id="playlists"></ul>
    </div>
  </aside>

  <main>
    <section id="current" class="panel panel-current"></section>
    <section class="panel panel-library">
      <div class="row">
        <div>
          <h2>Song library</h2>
          <p class="section-sub">Browse and add tracks to your playlist</p>
        </div>
        <label class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search title, artist or genre">
        </label>
      </div>
      <ul id="library" class="songs"></ul>
    </section>
  </main>

  <footer class="player">
    <div class="player-art" id="now-art" aria-hidden="true"></div>
    <div class="player-meta">
      <div id="now" class="player-now">Pick a song to play</div>
      <div id="now-sub" class="player-sub">Your next track starts here</div>
    </div>
    <audio id="audio" controls></audio>
  </footer>

  <div id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
